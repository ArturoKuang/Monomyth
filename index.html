<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Monomyth</title>
  </head>
  <body>
    <main>
      <h1>Monomyth</h1>
      <p>A small seeded scene while the game takes shape.</p>
      <div id="viewport" aria-label="Seeded 3D landscape"></div>
      <form id="controls">
        <label for="seed">World seed</label>
        <input
          id="seed"
          name="seed"
          type="number"
          min="-2147483648"
          max="2147483647"
          step="1"
          value="42"
          required
        />
        <button type="submit">Generate</button>
        <button id="reset" type="button">Reset</button>
      </form>
      <p id="status" role="status" aria-label="Scene status" aria-live="polite">Loading scene…</p>
      <output id="diagnostics" aria-label="Scene diagnostics"></output>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
